<!DOCTYPE html>
<html>
<head>
  <title>Upload Venmo CSV</title>
  <style>
    body { background-color: #000; color: #39FF14; font-family: 'Courier New', monospace; padding: 20px; }
    input[type="file"] { margin-top: 10px; }
    button { background: #FF00FF; color: #000; font-weight: bold; padding: 8px 16px; border: none; cursor: pointer; margin-top: 10px; }
    button:hover { opacity: 0.8; }
    a { color: #39FF14; text-decoration: none; display: block; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Upload Venmo Statement</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="POST" enctype="multipart/form-data">
    <input type="file" name="file" accept=".csv" required>
    <br>
    <button type="submit">Upload and Process</button>
  </form>

  <a href="{{ url_for('admin_dashboard') }}">← Back to Admin Dashboard</a>
</body>
</html>
